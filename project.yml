name: FiatPreheat
options:
  bundleIdPrefix: dk.koster
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple developer team here (or in Xcode › Signing & Capabilities).
    DEVELOPMENT_TEAM: YRGB65TR3L
targets:
  FiatPreheat:
    type: application
    platform: iOS
    sources: [FiatPreheat, Shared]
    dependencies:
      - target: VarmeWidgets
        embed: true
    entitlements:
      path: FiatPreheat/Support/Varme.entitlements
      properties:
        com.apple.security.application-groups: [group.dk.koster.varme]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.koster.varme
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Varme"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: FiatPreheat/Support/Info.plist
      properties:
        UIBackgroundModes: [fetch]
        UIAppFonts: [Geist-Regular.ttf, Geist-Medium.ttf, Geist-SemiBold.ttf, Sora.ttf]
        BGTaskSchedulerPermittedIdentifiers: [dk.koster.varme.schedule]
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: dk.koster.varme
            CFBundleURLSchemes: [varme]
        NSLocationWhenInUseUsageDescription: "Varme uses your position to show how far away the car is and to give you walking directions to it."
  VarmeWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - VarmeWidgets
      - Shared
      - FiatPreheat/Varme/Theme.swift
      - FiatPreheat/Resources/Assets.xcassets
      - FiatPreheat/Resources/Fonts
    entitlements:
      path: VarmeWidgets/VarmeWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.dk.koster.varme]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.koster.varme.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Varme"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: ""
        SKIP_INSTALL: YES
    info:
      path: VarmeWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts: [Sora.ttf]
  FiatPreheatTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FiatPreheatTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dk.koster.FiatPreheatTests
    dependencies:
      - target: FiatPreheat
schemes:
  FiatPreheat:
    build:
      targets:
        FiatPreheat: all
        VarmeWidgets: all
        FiatPreheatTests: [test]
    test:
      targets: [FiatPreheatTests]
