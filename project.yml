name: FiatPreheat
options:
  bundleIdPrefix: dk.koster
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple developer team here (or in Xcode › Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
targets:
  FiatPreheat:
    type: application
    platform: iOS
    sources: [FiatPreheat]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.koster.FiatPreheat
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "500e Preheat"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: FiatPreheat/Support/Info.plist
      properties:
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [dk.koster.FiatPreheat.schedule]
  FiatPreheatTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FiatPreheatTests]
    dependencies:
      - target: FiatPreheat
schemes:
  FiatPreheat:
    build:
      targets:
        FiatPreheat: all
        FiatPreheatTests: [test]
    test:
      targets: [FiatPreheatTests]
